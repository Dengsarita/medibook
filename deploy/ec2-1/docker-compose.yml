services:
  nginx:
    image: nginx:alpine
    environment:
      EC2_3_IP: ${EC2_3_IP}
    volumes:
      - ../../nginx/ec2.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  api-gateway:
    build: ../../api-gateway
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      REGISTRATION_URL: http://${EC2_2_IP}:4001
      LOGIN_URL: http://${EC2_2_IP}:4002
      DOCTOR_URL: http://nginx:8080
      APPOINTMENT_URL: http://${EC2_4_IP}:4004
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    restart: unless-stopped